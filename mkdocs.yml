site_name: 柏源 Infra
site_description: 智算中心架构、异构计算、高速网络、并行存储与大模型工程化实战知识库
site_author: 柏源
site_url: https://amooms.github.io/ai-infra-wiki/
repo_name: amooms/ai-infra-wiki
repo_url: https://github.com/amooms/ai-infra-wiki
edit_uri: blob/main/docs/
copyright: Copyright © 2024 - 2026 柏源 | 基于 CC BY-NC-SA 4.0 许可协议发布

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/branding/logo.svg
  favicon: assets/branding/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang:
        - en
        - zh
  - tags
  - git-revision-date-localized:
      type: date
      locale: zh
      fallback_to_build_date: true
  - timetoread

hooks:
  - hooks/auto_catalog.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/amooms/ai-infra-wiki
  generator: false
  giscus:
    repo: amooms/ai-infra-wiki
    repo_id: ""
    category: Announcements
    category_id: ""

extra_css:
  - stylesheets/extra.css
  - stylesheets/calculators.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/extra.js
  - javascripts/calculators.js

nav:
  - 首页: index.md
  - 文章库: articles/index.md
  - L0 物理与供电:
      - 概览: server/index.md
      - 为什么一台 8 卡 GPU 服务器会有多个 PSU？: server/为什么一台8卡GPU服务器会有多个PSU_v2.md
  - L1 算力与GPU:
      - 概览: gpu/index.md
      - GPU 互联: gpu/interconnect.md
      - PCIe 与 OAM: gpu/pcie-oam.md
      - 计算精度: gpu/precision.md
  - L2 智算网络:
      - 概览: network/index.md
      - InfiniBand: network/infiniband.md
      - RDMA: network/rdma.md
      - RoCE: network/roce.md
      - 集群拓扑: network/topology.md
  - L3 存储:
      - 概览: storage/index.md
      - 分布式存储: storage/distributed-storage.md
      - 并行存储: storage/parallel-storage.md
  - L4 调度运维:
      - 概览: hpc/index.md
      - MPI: hpc/mpi.md
      - 作业调度: hpc/scheduling.md
  - L5 大模型工程:
      - 概览: llm/index.md
      - KV Cache: llm/kv-cache.md
      - 并行策略: llm/parallel.md
      - SGLang: llm/sglang.md
      - vLLM: llm/vllm.md
  - 🛠️ 智算工具箱:
      - 大模型显存与卡数估算器: tools/llm-memory-calculator.md
      - 智算网络收敛比估算器: tools/network-oversubscription-calculator.md
  - 项目实战:
      - 概览: project/index.md
      - 部署实施: project/deployment.md
      - 网络设计: project/network-design.md
      - 供电与机柜: project/power-and-rack.md
      - 服务器选型: project/server-selection.md
