{% if page and page.meta and page.meta.page_type == "article" %}
  <section class="by-comments" aria-label="文章评论">
    <div class="giscus"></div>
    {% if config.extra.giscus.repo_id and config.extra.giscus.category_id %}
      <script src="https://giscus.app/client.js" data-repo="{{ config.extra.giscus.repo }}" data-repo-id="{{ config.extra.giscus.repo_id }}" data-category="{{ config.extra.giscus.category }}" data-category-id="{{ config.extra.giscus.category_id }}" data-mapping="pathname" data-strict="0" data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top" data-theme="preferred_color_scheme" data-lang="zh-CN" crossorigin="anonymous" async></script>
      <script>
        (() => {
          const syncGiscusTheme = () => {
            const theme = document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark" : "light";
            document.querySelector("iframe.giscus-frame")?.contentWindow?.postMessage({ giscus: { setConfig: { theme } } }, "https://giscus.app");
          };
          if (!window.__baiyuanGiscusThemeObserver) {
            window.__baiyuanGiscusThemeObserver = new MutationObserver(syncGiscusTheme);
            window.__baiyuanGiscusThemeObserver.observe(document.body, { attributes: true, attributeFilter: ["data-md-color-scheme"] });
          }
          syncGiscusTheme();
        })();
      </script>
    {% endif %}
  </section>
{% endif %}
